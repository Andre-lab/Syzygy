[project]
name = "syzygy"
version = "0.1.0"
description = "A lightweight and conditionable Dirichlet flow matching model for the generation of artificial homologues and new members of existing protein families."
readme = "README.md"
# torch 2.4.0 (the macOS pin below) only ships Python 3.12 wheels, so newer
# Python versions cannot be resolved/installed until that pin is relaxed.
requires-python = ">=3.12,<3.13"
dependencies = [
  "biopython>=1.85",
  "hydra-core>=1.3.2",
  "hydra-colorlog>=1.2.0",
  "lightning>=2.5.1.post0",
  "numpy>=1.26.4",
  "omegaconf>=2.3.0",
  "rich>=15.0.0",
  "scikit-learn>=1.6.1",
  "scipy>=1.11",
  "torch>=2.4.0; sys_platform == 'linux'",
  "torch<=2.4.0; sys_platform != 'linux'",
  "torchmetrics>=1.7.1",
]

[project.optional-dependencies]
# Optional Weights & Biases logging (main.logging.wandb=true). The plotting
# libraries are only used for the WandB-only diagnostic figures.
wandb = [
  "wandb>=0.20.1",
  "matplotlib>=3.10.1",
  "pandas>=2.0",
  "seaborn>=0.13.2",
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
